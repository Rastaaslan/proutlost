// This test creates a real JournalStore, forces WAL, closes and reopens the
// SAME private pure-test directory. Run on actual Linux FS, never Windows.
tasks.register('directorJournalConsumerCursorRecoveryTest', JavaExec) {
    dependsOn tasks.named('directorTestClasses')
    classpath = sourceSets.directorTest.runtimeClasspath
    mainClass = 'fr.proutlost.director.persistence.JournalConsumerCursorRecoveryTests'
    workingDir = project.projectDir
    def cursorRecoveryOutput = providers.gradleProperty('directorP14ConsumerCursorOutput').orNull
    jvmArgs '-ea', '-Xmx256m', '-XX:ActiveProcessorCount=1'
    doFirst {
        if (!System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('linux'))
            throw new GradleException('Consumer cursor real fsync/reopen test requires actual Linux FS')
        def output = cursorRecoveryOutput
        if (output == null || !new File(output).isAbsolute() || new File(output).exists())
            throw new GradleException('Pass a NEW absolute -PdirectorP14ConsumerCursorOutput directory')
        setArgs([output])
        println('P14_CONSUMER_CURSOR_LINUX_FSYNC_START output=' + output)
    }
}

