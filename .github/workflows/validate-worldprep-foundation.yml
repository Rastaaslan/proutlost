name: Validate WorldPrep foundation

on:
  push:
    branches:
      - codex/executer-le-master-run-overnight-worldprep

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' || github.event.head_commit.message != 'build: restore verified Gradle 8.14.4 wrapper'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/executer-le-master-run-overnight-worldprep
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify wrapper binary
        shell: bash
        run: |
          set -euo pipefail
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict
          grep -F 'gradle-8.14.4-bin.zip' gradle/wrapper/gradle-wrapper.properties

      - name: Static safety checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          if grep -R --include='*.java' -n '\.ordinal(' src; then
            echo 'enum.ordinal() dispatch/reference remains in src' >&2
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Build
        run: ./gradlew build --no-daemon

      - name: NeoForge GameTests
        run: ./gradlew runGameTestServer --no-daemon

      - name: Dedicated server reaches Done
        shell: bash
        run: |
          set +e
          timeout 180s ./gradlew runServer --no-daemon > runserver.log 2>&1
          status=$?
          set -e
          cat runserver.log
          grep -E 'Done \([^)]*\)!' runserver.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "runServer exited unexpectedly with status $status" >&2
            exit "$status"
          fi
