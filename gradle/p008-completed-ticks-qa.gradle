// Explicit installed-QA addon only. No registration in neoForge.mods, no input
// to jar/directorJar, and no effect on normal runs unless operator installs it.
sourceSets {
    p008CompletedTickQa {
        java.setSrcDirs(['src/p008CompletedTickQa/java'])
        resources.setSrcDirs(['src/p008CompletedTickQa/resources'])
        compileClasspath += configurations.compileClasspath
        runtimeClasspath += configurations.runtimeClasspath
    }
    p008CompletedTickQaTest {
        java.setSrcDirs(['src/p008CompletedTickQa/java', 'src/p008CompletedTickQaTest/java'])
        java.include '**/CompletedTickCapture.java', '**/PreviousCompletedTickReader.java', '**/CompletedTickCaptureTests.java'
        resources.setSrcDirs([])
    }
}

tasks.register('p008CompletedTickPureTest', JavaExec) {
    group = 'verification'
    description = 'Pure bounded sink/previous-slot tests; not Minecraft or client qualification'
    dependsOn tasks.named('p008CompletedTickQaTestClasses')
    classpath = sourceSets.p008CompletedTickQaTest.runtimeClasspath
    mainClass = 'fr.proutlost.p008qa.ticks.CompletedTickCaptureTests'
    args project.file('build/p008-completed-ticks-pure-' + providers.gradleProperty('p008RunId').getOrElse('a01'))
    jvmArgs '-ea', '-Xmx256m', '-XX:ActiveProcessorCount=1'
}

tasks.register('p008CompletedTicksQaJar', Jar) {
    group = 'build'
    description = 'Separate TEST_ONLY dedicated-server completed-tick observer addon'
    dependsOn tasks.named('p008CompletedTickQaClasses')
    archiveBaseName = 'proutlost-p008-completed-ticks-qa'
    archiveVersion = '1.0.0-TEST_ONLY'
    archiveClassifier = ''
    from sourceSets.p008CompletedTickQa.output
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    outputs.upToDateWhen { false }
    outputs.doNotCacheIf('QA candidate exact class parity required', { true })
    manifest { attributes 'Implementation-Title': 'P008 TEST_ONLY completed vanilla tick observer',
        'P008-QA-Only': 'true', 'P008-QA-CPU-Scope': 'NONE' }
    doLast {
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { archive ->
            def entries = java.util.Collections.list(archive.entries())*.name
            def packed = entries.findAll { it.endsWith('.class') }.toSet()
            if (packed.isEmpty() || packed.any { !it.startsWith('fr/proutlost/p008qa/ticks/') || it.endsWith('Tests.class') })
                throw new GradleException('Completed-tick QA addon has unexpected/empty class inventory')
            if (!entries.contains('META-INF/neoforge.mods.toml'))
                throw new GradleException('Completed-tick QA addon metadata missing')
            def compiled = new TreeMap<String, byte[]>()
            source.visit { item ->
                if (!item.directory && item.relativePath.pathString.endsWith('.class')) {
                    def name = item.relativePath.pathString.replace('\\', '/')
                    if (compiled.putIfAbsent(name, java.nio.file.Files.readAllBytes(item.file.toPath())) != null)
                        throw new GradleException('Duplicate completed-tick QA compiled class')
                }
            }
            if (compiled.keySet() != packed) throw new GradleException('Completed-tick QA compiled/JAR inventory differs')
            compiled.each { name, bytes ->
                def actual = archive.getInputStream(archive.getEntry(name)).withCloseable { it.readAllBytes() }
                if (!java.util.Arrays.equals(bytes, actual)) throw new GradleException('Completed-tick QA JAR stale class: ' + name)
            }
            println 'P008_COMPLETED_TICKS_QA_JAR_PARITY_PASS classes=' + packed.size()
        }
    }
}
